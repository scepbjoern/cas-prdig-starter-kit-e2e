<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1140" viewBox="0 0 1280 1140" role="img" aria-label="Skills, Reihenfolge und Chatwechsel"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466774"/></marker></defs><rect width="1280" height="1140" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#173c49}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px}</style><text class="title" x="40" y="48">Skills, Reihenfolge und Chatwechsel</text><text class="sub" x="40" y="82">Zwei Bauwege · unabhängige Reviews · menschliche Entscheidungen und Abnahme</text><rect x="40" y="110" width="1200" height="111" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="144">1 E2E-Planungschat</text><text class="sub" x="60" y="175">init-project → define-prototype → plan-solution-architecture</text><text class="sub" x="60" y="203">Neuer Reviewchat: review-architecture → beim Autor: integrate-architecture-review</text><path d="M640 221 V250" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="260" width="1200" height="111" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="294">2 Neuer System-Planungschat</text><text class="sub" x="60" y="325">System-init-project → create-prd → unabhängiger review-prd → integrate-prd-review</text><text class="sub" x="60" y="353">Bei GUI: define-system-design → plan-system-architecture → Review → Integration</text><path d="M640 371 V400" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="410" width="1200" height="83" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text class="label" x="60" y="444">3 Im System-Planungschat: slice-features</text><text class="sub" x="60" y="475">Issues selbst lesen · Umfang und Zuständigkeiten abstimmen · Bauweg wählen</text><path d="M640 493 V525 H330 V555" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 525 H950 V555" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="565" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="599">4a Reguläre Features</text><text class="sub" x="60" y="630">Planungschat: plan-feature</text><text class="sub" x="60" y="658">Neuer Chat: implement-feature</text><text class="sub" x="60" y="686">Dort auch validate-feature und Korrekturen</text><rect x="660" y="565" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="680" y="599">4b Gesamtbau: build-system</text><text class="sub" x="680" y="630">Neuer Chat: Mock bauen und gezielt verbessern</text><text class="sub" x="680" y="658">Oder: begrenzter Nicht-Mock-Bauversuch</text><text class="sub" x="680" y="686">Versuch auswerten → zurück zur Planung</text><rect x="40" y="745" width="1200" height="83" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="779">Bei fehlendem Fundament: bootstrap-system</text><text class="sub" x="60" y="810">Hilfsschritt im Implementierungschat; kein zusätzlicher Pflichtchat oder eigener Bauweg</text><path d="M330 704 V730" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 704 V730" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 828 V860" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="870" width="1200" height="111" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text class="label" x="60" y="904">5 Fachlich abnehmen und den regulären Stand integrieren</text><text class="sub" x="60" y="935">Feature-Weg: integrate-feature · Mock: vereinbarten Stand koordinieren und prüfen</text><text class="sub" x="60" y="963">Gemeinsam: validate-e2e → Gruppenabnahme → finish-release</text><text class="sub" x="40" y="1050">Planungsänderungen zurück in den System-Planungschat; Versuchscode nicht automatisch integrieren.</text><text class="sub" x="40" y="1085">Prüfen, gezielt committen und pushen gehört zur Ergebnissicherung. Tests ersetzen keine menschliche Abnahme.</text></svg>