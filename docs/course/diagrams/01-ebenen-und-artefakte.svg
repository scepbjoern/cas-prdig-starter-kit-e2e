<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-label="Ebenen und Artefakte: zwei Wege zur Umsetzung"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466774"/></marker></defs><rect width="1280" height="890" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#173c49}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px}</style><text class="title" x="40" y="48">Ebenen und Artefakte: zwei Wege zur Umsetzung</text><text class="sub" x="40" y="82">Gemeinsame Planung → Systemplanung → gewählter Bauweg → fachliche Abnahme</text><rect x="40" y="110" width="1200" height="83" rx="12" fill="#e5f4ec" stroke="#92aeb4"/><text class="label" x="60" y="144">Solution: gemeinsame Grundlage</text><text class="sub" x="60" y="175">Prototype Brief · Solution Architecture · Interface/Data Contracts · E2E-Szenarien</text><path d="M640 193 V225" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="235" width="1200" height="111" rx="12" fill="#e5f4ec" stroke="#92aeb4"/><text class="label" x="60" y="269">System: gemeinsam im System-Planungschat konkretisieren</text><text class="sub" x="60" y="300">PRD · Design Brief bei GUI · System Architecture · geprüfte Reviewbehandlung</text><text class="sub" x="60" y="328">slice-features: tatsächlichen Umfang, Kriterien und Zuständigkeiten festlegen</text><path d="M640 346 V380 H330 V410" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 380 H950 V410" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="420" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="454">Feature-Weg</text><text class="sub" x="60" y="485">Feature Plan im System-Planungschat</text><text class="sub" x="60" y="513">Neuer Chat: implementieren und validieren</text><text class="sub" x="60" y="541">Nächstes Feature bedarfsgerecht planen</text><rect x="660" y="420" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="680" y="454">Gesamtbau: build-system</text><text class="sub" x="680" y="485">Neuer Chat liest gespeicherte Systemunterlagen</text><text class="sub" x="680" y="513">Mock: reguläre Umsetzung, Code behalten</text><text class="sub" x="680" y="541">Nicht-Mock: optionaler Versuch auf eigenem Branch</text><path d="M330 559 V595 H640 V620" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 559 V595 H640" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="630" width="1200" height="111" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text class="label" x="60" y="664">Menschen prüfen das Ergebnis und entscheiden fachlich</text><text class="sub" x="60" y="695">Mock/Feature: abnehmen und integrieren · Versuch: Erkenntnisse in die Planung zurückführen</text><text class="sub" x="60" y="723">Systemübergreifend: E2E prüfen, Gruppe nimmt ab; kein Laufnachweis allein durch Planung</text><text class="sub" x="40" y="830">bootstrap-system unterstützt bei fehlendem Fundament. Ein Feature Plan ist beim Gesamtbau keine Pflicht.</text></svg>