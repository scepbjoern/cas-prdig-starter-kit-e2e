<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="build-system: Gesamtbau oder begrenzter Bauversuch"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#466774"/></marker></defs><rect width="1280" height="920" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#173c49}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.sub{font-size:20px}</style><text class="title" x="40" y="48">build-system: Gesamtbau oder begrenzter Bauversuch</text><text class="sub" x="40" y="82">Vorbereitung im bisherigen System-Planungschat · Bau in einem neuen Implementierungschat</text><rect x="40" y="110" width="1200" height="83" rx="12" fill="#e5f4ec" stroke="#92aeb4"/><text class="label" x="60" y="144">1 Gespeicherte Grundlagen und ausgewählter Umfang</text><text class="sub" x="60" y="175">PRD · Systemarchitektur · Design · E2E-Verträge · Feature-Issues aus slice-features</text><path d="M640 193 V220" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="230" width="1200" height="111" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="264">2 Neuer Implementierungschat: @build-system</text><text class="sub" x="60" y="295">Quellen lesen → bei Bedarf bootstrap-system → zusammenhängend bauen → starten und prüfen</text><text class="sub" x="60" y="323">Kleine Annahmen dokumentieren; fachliche Kernregeln und Verträge einhalten</text><path d="M640 341 V375 H330 V405" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 375 H950 V405" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="415" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="449">Mock: normaler Umsetzungsweg</text><text class="sub" x="60" y="480">Im System-Repository bauen</text><text class="sub" x="60" y="508">Code behalten und gezielt verbessern</text><text class="sub" x="60" y="536">Keine Pflicht zu einzelnen Feature Plans</text><rect x="660" y="415" width="580" height="139" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="680" y="449">Anderes System: optionaler Versuch</text><text class="sub" x="680" y="480">Zeitlich begrenzt, eigener Versuchsbranch</text><text class="sub" x="680" y="508">Bei paralleler Arbeit eigener Worktree</text><text class="sub" x="680" y="536">Versuchscode nicht automatisch übernehmen</text><path d="M330 554 V585 H640 V615" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950 554 V585 H640" fill="none" stroke="#466774" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="625" width="1200" height="111" rx="12" fill="#fff0d9" stroke="#92aeb4"/><text class="label" x="60" y="659">3 Ergebnis selbst ausprobieren</text><text class="sub" x="60" y="690">Agent nennt Start, tatsächliche Tests, Grenzen und nächsten Schritt</text><text class="sub" x="60" y="718">Mensch prüft fachlich; beim Mock folgen Abnahme und passende Integrationsprüfungen</text><rect x="40" y="765" width="1200" height="111" rx="12" fill="#e7f0fc" stroke="#92aeb4"/><text class="label" x="60" y="799">4 Passend weiterarbeiten</text><text class="sub" x="60" y="830">Fehler: Implementierungschat · geänderte Planung: System-Planungschat</text><text class="sub" x="60" y="858">Versuch: Erkenntnisse sichern, danach reguläre Feature-Umsetzung; Mock: gezielt nachbessern</text></svg>